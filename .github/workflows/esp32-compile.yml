name: Compile ESP32 firmware (Core 3.0.3 pinned)
on:
  workflow_dispatch:
  push:
    paths:
      - 'esp32/**'
      - '.github/workflows/esp32-compile.yml'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.0.3 (pinned, NOT latest)
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.3 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile SmartGlassHUD (GC9107)
        run: arduino-cli compile --profile hud303 esp32/SmartGlassHUD
